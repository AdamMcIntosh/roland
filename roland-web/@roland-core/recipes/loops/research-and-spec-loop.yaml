name: research-and-spec-loop
description: >
  Research and specification loop — investigate a problem space, synthesize findings into an
  actionable spec, validate completeness, critique gaps, and iterate until the spec is solid.
  No code verification gates; critic validates synthesis quality.
phases:
  - phase: plan
    label: Plan investigation
    agent: pm
    specialist_spawns:
      - role: planner
        prompt_template: "Plan research scope for {goal}"
  - phase: act
    label: Research and draft spec
    agent: researcher
    specialist_spawns:
      - role: researcher
        primary: true
      - role: oracle
        prompt_template: "Deep research for {goal} (iteration {iteration})"
  - phase: verify
    label: Validate findings
    agent: critic
  - phase: critique
    label: Critique synthesis
    agent: critic
  - phase: retry
    label: Retry research gaps
    optional: true
  - phase: observe
    label: Record learnings
    agent: researcher
    specialist_spawns:
      - role: writer
        prompt_template: "Document findings for iteration {iteration}"
  - phase: reflect
    label: Reflect on spec quality
    optional: true
    agent: researcher
maxIterations: 3
maxRetries: 2
escalationThreshold: 3
testModeMaxRetries: 5
testModeEscalationThreshold: 6
reflection: true
exit_conditions:
  - type: confidence_streak
    description: Spec confidence stable across iterations
    minConfidence: 0.8
    consecutiveIterations: 2
