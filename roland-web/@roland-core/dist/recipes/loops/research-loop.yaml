name: research-loop
deprecated: true
alias_of: research-and-plan-loop
description: >
  [DEPRECATED — use research-and-plan-loop] Lightweight research loop.
phases:
  - phase: plan
    label: Plan research
    agent: pm
  - phase: act
    label: Research & synthesize
    agent: researcher
  - phase: verify
    label: Validate findings
    agent: critic
  - phase: critique
    label: Critique synthesis
    agent: critic
  - phase: retry
    label: Retry research gaps
    optional: true
  - phase: observe
    label: Observe & record
    agent: researcher
maxIterations: 3
maxRetries: 2
escalationThreshold: 3
testModeMaxRetries: 4
testModeEscalationThreshold: 5
