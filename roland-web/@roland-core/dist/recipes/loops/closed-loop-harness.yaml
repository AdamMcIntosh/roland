# Deprecated — use full-cycle-verified-loop. Kept for backward compatibility with in-flight runs.
name: closed-loop-harness
deprecated: true
alias_of: full-cycle-verified-loop
description: >
  [Deprecated] Alias for full-cycle-verified-loop. Use --loop-template=full-cycle-verified-loop
  for new missions. This template resolves to the same phase graph and thresholds.
phases:
  - phase: plan
    label: Plan work
    agent: pm
  - phase: act
    label: Implement changes
    agent: coding
  - phase: verify
    label: Evaluation gates
    agent: verifier
    verification:
      - lint
      - unit
      - typecheck
  - phase: critique
    label: Self-critique
    agent: critic
  - phase: retry
    label: Smart retry
    optional: true
  - phase: escalate
    label: Human escalation
    optional: true
    agent: pm
  - phase: observe
    label: Observe and record
    agent: researcher
  - phase: reflect
    label: Reflect on learnings
    optional: true
    agent: researcher
maxIterations: 10
maxRetries: 3
escalationThreshold: 4
testModeMaxRetries: 8
testModeEscalationThreshold: 10
timeout_ms: 1800000
exponential_backoff: true
min_confidence: 0.85
reflection: true
exit_conditions:
  - type: all_gates_pass
    description: All evaluation gates pass with accepted confidence
  - type: confidence_streak
    description: Success confidence ≥ 0.85 for 2 consecutive iterations
    minConfidence: 0.85
    consecutiveIterations: 2
