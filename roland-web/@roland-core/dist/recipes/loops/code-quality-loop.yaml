# Deprecated — use refactor-and-modernize-loop.
name: code-quality-loop
deprecated: true
alias_of: refactor-and-modernize-loop
description: >
  [Deprecated] Alias for refactor-and-modernize-loop. Use --loop-template=refactor-and-modernize-loop
  for new missions.
phases:
  - phase: plan
    label: Plan quality work
    agent: pm
  - phase: act
    label: Implement fixes
    agent: coding
  - phase: verify
    label: Quality gates
    agent: verifier
    verification:
      - lint
      - unit
      - typecheck
  - phase: critique
    label: Critique quality
    agent: critic
  - phase: retry
    label: Retry focused fixes
    optional: true
  - phase: observe
    label: Observe metrics
    agent: researcher
  - phase: reflect
    label: Reflection pass
    optional: true
    agent: critic
maxIterations: 4
maxRetries: 3
escalationThreshold: 4
testModeMaxRetries: 6
testModeEscalationThreshold: 8
min_confidence: 0.8
reflection: true
exit_conditions:
  - type: all_gates_pass
    description: Lint, unit, and typecheck gates pass
