name: standard-code-loop
description: >
  Canonical software loop — plan work, implement, verify with tests/lint/typecheck, critique
  output, retry on failure, observe state before next iteration. Default template for most projects.
phases:
  - phase: plan
    label: Plan
    agent: pm
    specialist_spawns:
      - role: planner
  - phase: act
    label: Act
    agent: coding
  - phase: verify
    label: Verify
    agent: verifier
    verification:
      - unit
      - lint
      - typecheck
  - phase: critique
    label: Critique
    agent: critic
  - phase: retry
    label: Retry
    optional: true
  - phase: observe
    label: Observe
    agent: researcher
    specialist_spawns:
      - role: researcher
maxIterations: 5
maxRetries: 3
escalationThreshold: 4
testModeMaxRetries: 6
testModeEscalationThreshold: 8
