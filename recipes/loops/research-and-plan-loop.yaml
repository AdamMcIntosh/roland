name: research-and-plan-loop
description: >
  Research and planning loop — investigate a problem space, synthesize findings into an
  actionable plan or spec, validate completeness, critique gaps, and iterate until solid.
  No code verification gates; critic validates synthesis quality.
  Parameterized via aliases: research-loop (lightweight, maxIterations 2),
  research-and-spec-loop / research-synthesis-loop (spec-focused, same phases).
parameters:
  mode:
    enum: [lightweight, standard, spec]
    default: standard
    description: >
      lightweight — quick investigation (use alias research-loop);
      standard — full plan loop (default);
      spec — actionable spec emphasis (use alias research-and-spec-loop).
  max_iterations:
    type: integer
    default: 3
    description: Override via template config; lightweight alias uses 2.
phases:
  - phase: plan
    label: Plan investigation
    agent: pm
    specialist_spawns:
      - role: planner
        prompt_template: "Plan research scope for {goal}"
  - phase: act
    label: Research and draft plan
    agent: researcher
    specialist_spawns:
      - role: researcher
        primary: true
      - role: oracle
        prompt_template: "Deep research for {goal} (iteration {iteration})"
  - phase: verify
    label: Validate findings
    agent: critic
  - phase: critique
    label: Critique synthesis
    agent: critic
  - phase: retry
    label: Retry research gaps
    optional: true
  - phase: observe
    label: Record learnings
    agent: researcher
    specialist_spawns:
      - role: writer
        prompt_template: "Document findings for iteration {iteration}"
  - phase: reflect
    label: Reflect on plan quality
    optional: true
    agent: researcher
maxIterations: 3
maxRetries: 2
escalationThreshold: 3
testModeMaxRetries: 5
testModeEscalationThreshold: 6
reflection: true
exit_conditions:
  - type: confidence_streak
    description: Plan confidence stable across iterations
    minConfidence: 0.8
    consecutiveIterations: 2
