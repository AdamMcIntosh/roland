name: research-loop
description: >
  Lightweight research loop — plan investigation, gather intel, validate findings, critique synthesis,
  retry gaps. Shorter iteration budget than research-and-spec-loop; no formal spec exit conditions.
phases:
  - phase: plan
    label: Plan research
    agent: pm
  - phase: act
    label: Research & synthesize
    agent: researcher
  - phase: verify
    label: Validate findings
    agent: critic
  - phase: critique
    label: Critique synthesis
    agent: critic
  - phase: retry
    label: Retry research gaps
    optional: true
  - phase: observe
    label: Observe & record
    agent: researcher
maxIterations: 3
maxRetries: 2
escalationThreshold: 3
testModeMaxRetries: 4
testModeEscalationThreshold: 5
